<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up — RefillReminder</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #a8c4e8 0%, #d4a8e8 50%, #f8b4c8 100%);
      overflow: hidden;
    }
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      opacity: 0.2;
      animation: float 9s ease-in-out infinite;
      z-index: 0;
    }
    body::before { width: 350px; height: 350px; background: #7986cb; top: -80px; right: -80px; }
    body::after  { width: 280px; height: 280px; background: #f06292; bottom: -60px; left: -60px; animation-delay: 4s; }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-25px)} }

    .card {
      position: relative; z-index: 1;
      background: rgba(255,255,255,0.88);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: 28px;
      padding: 44px 42px;
      width: 100%; max-width: 430px;
      box-shadow: 0 24px 60px rgba(100,100,200,0.2);
      animation: slideUp 0.6s cubic-bezier(0.16,1,0.3,1) both;
    }
    @keyframes slideUp { from{opacity:0;transform:translateY(40px)} to{opacity:1;transform:translateY(0)} }

    .logo { text-align:center; margin-bottom:28px; }
    .logo-icon { font-size:48px; display:block; margin-bottom:8px; animation:bounce 2s ease-in-out infinite; }
    @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
    .logo h1 { font-size:24px; font-weight:700; color:#4527a0; }
    .logo p  { font-size:13px; color:#9e9e9e; margin-top:4px; }

    .form-group { margin-bottom:18px; }
    label { display:block; font-size:13px; font-weight:600; color:#4527a0; margin-bottom:6px; }
    input {
      width:100%; padding:12px 15px;
      border:2px solid #c5cae9; border-radius:12px;
      font-size:15px; font-family:'Outfit',sans-serif;
      background:rgba(255,255,255,0.9); color:#333; outline:none;
      transition:border-color .25s, box-shadow .25s;
    }
    input:focus { border-color:#7c4dff; box-shadow:0 0 0 4px rgba(124,77,255,0.12); }

    .row { display:grid; grid-template-columns:1fr 1fr; gap:14px; }

    .strength-bar { margin-top:6px; height:4px; border-radius:4px; background:#e0e0e0; overflow:hidden; }
    .strength-fill { height:100%; width:0; border-radius:4px; transition:width .3s, background .3s; }
    .strength-label { font-size:11px; color:#9e9e9e; margin-top:3px; }

    .btn {
      width:100%; padding:14px; border:none; border-radius:14px;
      font-size:16px; font-weight:700; font-family:'Outfit',sans-serif; cursor:pointer;
      background:linear-gradient(135deg,#7c4dff,#4527a0); color:#fff;
      box-shadow:0 6px 20px rgba(69,39,160,0.35);
      transition:transform .2s, box-shadow .2s;
    }
    .btn:hover  { transform:translateY(-2px); box-shadow:0 10px 28px rgba(69,39,160,0.4); }
    .btn:active { transform:translateY(0); opacity:.9; }

    .error-msg, .success-msg {
      display:none; border-radius:10px; padding:11px 14px;
      font-size:13px; margin-bottom:16px; text-align:center;
    }
    .error-msg { background:#fce4ec; color:#c62828; border:1px solid #ef9a9a; }
    .success-msg { background:#e8f5e9; color:#2e7d32; border:1px solid #a5d6a7; }
    .error-msg.show, .success-msg.show { display:block; }
    .error-msg.show { animation:shake .4s ease; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }

    .divider { text-align:center; margin:20px 0 16px; font-size:13px; color:#9e9e9e; }
    .link-btn {
      width:100%; padding:13px; border:2px solid #c5cae9; border-radius:14px;
      font-size:15px; font-weight:600; font-family:'Outfit',sans-serif; cursor:pointer;
      background:white; color:#4527a0; transition:all .2s;
    }
    .link-btn:hover { border-color:#7c4dff; background:#f3e5f5; }

    .footer-note { text-align:center; margin-top:20px; font-size:12px; color:#bbb; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <span class="logo-icon">✨</span>
    <h1>Create Account</h1>
    <p>Join RefillReminder today</p>
  </div>

  <div class="error-msg"   id="errorMsg"></div>
  <div class="success-msg" id="successMsg"></div>

  <form id="signupForm" onsubmit="handleSignup(event)">
    <div class="row">
      <div class="form-group">
        <label for="firstName">First Name</label>
        <input type="text" id="firstName" placeholder="e.g. Riya" required/>
      </div>
      <div class="form-group">
        <label for="lastName">Last Name</label>
        <input type="text" id="lastName" placeholder="e.g. Dutta"/>
      </div>
    </div>

    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="text" id="email" placeholder="you@example.com" required/>
    </div>

    <div class="form-group">
      <label for="newUsername">Username</label>
      <input type="text" id="newUsername" placeholder="Choose a username" required autocomplete="off"/>
    </div>

    <div class="form-group">
      <label for="newPassword">Password</label>
      <input type="password" id="newPassword" placeholder="Min 6 characters" required oninput="checkStrength(this.value)"/>
      <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
      <div class="strength-label" id="strengthLabel"></div>
    </div>

    <div class="form-group">
      <label for="confirmPassword">Confirm Password</label>
      <input type="password" id="confirmPassword" placeholder="Re-enter password" required/>
    </div>

    <button type="submit" class="btn" id="signupBtn">🚀 Create Account</button>
  </form>

  <div class="divider">Already have an account?</div>
  <button class="link-btn" onclick="window.location.href='/login.html'">🔐 Login Instead</button>

  <p class="footer-note">College Project · RefillReminder REST Service · 2026</p>
</div>

<script>
  // If already logged in, go to dashboard
  if (sessionStorage.getItem('rr_logged_in') === 'true') {
    window.location.href = '/index.html';
  }

  // Password strength checker
  function checkStrength(val) {
    const fill  = document.getElementById('strengthFill');
    const label = document.getElementById('strengthLabel');
    let strength = 0;
    if (val.length >= 6)  strength++;
    if (val.length >= 10) strength++;
    if (/[A-Z]/.test(val)) strength++;
    if (/[0-9]/.test(val)) strength++;
    if (/[^A-Za-z0-9]/.test(val)) strength++;

    const levels = [
      { pct:'20%', bg:'#ef5350', text:'Very Weak' },
      { pct:'40%', bg:'#ff7043', text:'Weak' },
      { pct:'60%', bg:'#ffca28', text:'Fair' },
      { pct:'80%', bg:'#66bb6a', text:'Strong' },
      { pct:'100%',bg:'#26a69a', text:'Very Strong' }
    ];
    const lvl = levels[Math.min(strength, 4)];
    fill.style.width      = val.length ? lvl.pct : '0';
    fill.style.background = lvl.bg;
    label.textContent     = val.length ? lvl.text : '';
    label.style.color     = lvl.bg;
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = '❌ ' + msg;
    el.className = 'error-msg show';
    document.getElementById('successMsg').className = 'success-msg';
  }
  function showSuccess(msg) {
    const el = document.getElementById('successMsg');
    el.textContent = '✅ ' + msg;
    el.className = 'success-msg show';
    document.getElementById('errorMsg').className = 'error-msg';
  }

  function handleSignup(e) {
    e.preventDefault();
    const firstName  = document.getElementById('firstName').value.trim();
    const lastName   = document.getElementById('lastName').value.trim();
    const email      = document.getElementById('email').value.trim();
    const username   = document.getElementById('newUsername').value.trim();
    const password   = document.getElementById('newPassword').value;
    const confirm    = document.getElementById('confirmPassword').value;

    // Basic validations
    if (username.length < 3)       return showError('Username must be at least 3 characters.');
    if (password.length < 6)       return showError('Password must be at least 6 characters.');
    if (password !== confirm)      return showError('Passwords do not match.');
    if (!email.includes('@'))      return showError('Please enter a valid email address.');

    // Load existing users from localStorage
    const users = JSON.parse(localStorage.getItem('rr_users') || '[]');

    // Check duplicate username
    if (users.find(u => u.username.toLowerCase() === username.toLowerCase())) {
      return showError('Username "' + username + '" is already taken. Choose another.');
    }
    // Check duplicate email
    if (users.find(u => u.email.toLowerCase() === email.toLowerCase())) {
      return showError('An account with this email already exists.');
    }

    // Save new user
    users.push({ firstName, lastName, email, username, password });
    localStorage.setItem('rr_users', JSON.stringify(users));

    showSuccess('Account created! Redirecting to login...');
    document.getElementById('signupBtn').textContent = '✅ Account Created!';
    document.getElementById('signupBtn').style.background = 'linear-gradient(135deg,#66bb6a,#2e7d32)';

    setTimeout(() => { window.location.href = '/login.html'; }, 1500);
  }
</script>
</body>
</html>

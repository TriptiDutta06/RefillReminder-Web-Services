<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — RefillReminder</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f8b4c8 0%, #d4a8e8 50%, #a8c4e8 100%);
      overflow: hidden;
    }
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      opacity: 0.25;
      animation: float 8s ease-in-out infinite;
      z-index: 0;
    }
    body::before { width:400px; height:400px; background:#f06292; top:-100px; left:-100px; }
    body::after  { width:300px; height:300px; background:#ab47bc; bottom:-80px; right:-80px; animation-delay:4s; }
    @keyframes float { 0%,100%{transform:translateY(0) scale(1)} 50%{transform:translateY(-30px) scale(1.05)} }

    .card {
      position:relative; z-index:1;
      background:rgba(255,255,255,0.88);
      backdrop-filter:blur(20px);
      border:1px solid rgba(255,255,255,0.6);
      border-radius:28px;
      padding:48px 44px;
      width:100%; max-width:420px;
      box-shadow:0 24px 60px rgba(180,100,180,0.2);
      animation:slideUp .6s cubic-bezier(0.16,1,0.3,1) both;
    }
    @keyframes slideUp { from{opacity:0;transform:translateY(40px)} to{opacity:1;transform:translateY(0)} }

    .logo { text-align:center; margin-bottom:30px; }
    .logo-icon { font-size:52px; line-height:1; margin-bottom:10px; display:block; animation:bounce 2s ease-in-out infinite; }
    @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
    .logo h1 { font-size:26px; font-weight:700; color:#6a1b9a; letter-spacing:-.5px; }
    .logo p  { font-size:13px; color:#9e9e9e; margin-top:4px; }

    .form-group { margin-bottom:18px; }
    label { display:block; font-size:13px; font-weight:600; color:#6a1b9a; margin-bottom:7px; }
    input[type="text"], input[type="password"] {
      width:100%; padding:13px 16px;
      border:2px solid #e1bee7; border-radius:12px;
      font-size:15px; font-family:'Outfit',sans-serif;
      background:rgba(255,255,255,0.9); color:#333; outline:none;
      transition:border-color .25s, box-shadow .25s;
    }
    input:focus { border-color:#ab47bc; box-shadow:0 0 0 4px rgba(171,71,188,.12); }

    .hint {
      text-align:center; font-size:12px; color:#ba68c8;
      margin-bottom:22px; background:#f3e5f5;
      padding:8px 14px; border-radius:10px;
    }
    .hint strong { color:#7b1fa2; }

    .btn {
      width:100%; padding:14px; border:none; border-radius:14px;
      font-size:16px; font-weight:700; font-family:'Outfit',sans-serif; cursor:pointer;
      background:linear-gradient(135deg,#ab47bc,#7b1fa2); color:#fff;
      letter-spacing:.4px;
      box-shadow:0 6px 20px rgba(123,31,162,.35);
      transition:transform .2s, box-shadow .2s;
    }
    .btn:hover  { transform:translateY(-2px); box-shadow:0 10px 28px rgba(123,31,162,.4); }
    .btn:active { transform:translateY(0); opacity:.9; }

    .error-msg {
      display:none; background:#fce4ec; color:#c62828;
      border:1px solid #ef9a9a; border-radius:10px;
      padding:11px 14px; font-size:13px; margin-bottom:16px; text-align:center;
    }
    .error-msg.show { display:block; animation:shake .4s ease; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }

    .divider { text-align:center; margin:22px 0 16px; font-size:13px; color:#9e9e9e; }
    .link-btn {
      width:100%; padding:13px; border:2px solid #e1bee7; border-radius:14px;
      font-size:15px; font-weight:600; font-family:'Outfit',sans-serif; cursor:pointer;
      background:white; color:#7b1fa2; transition:all .2s;
    }
    .link-btn:hover { border-color:#ab47bc; background:#f3e5f5; }

    .footer-note { text-align:center; margin-top:22px; font-size:12px; color:#bbb; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <span class="logo-icon">🌸</span>
    <h1>RefillReminder</h1>
    <p>Household Refill Management System</p>
  </div>

  <div class="hint">
    Default admin — Username: <strong>admin</strong> &nbsp;|&nbsp; Password: <strong>admin123</strong>
  </div>

  <div class="error-msg" id="errorMsg"></div>

  <form id="loginForm" onsubmit="handleLogin(event)">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Enter your username" autocomplete="off" required/>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter your password" required/>
    </div>
    <button type="submit" class="btn" id="loginBtn">🔐 Login</button>
  </form>

  <div class="divider">Don't have an account?</div>
  <button class="link-btn" onclick="window.location.href='/register.html'">✨ Create New Account</button>

  <p class="footer-note">College Project · RefillReminder REST Service · 2026</p>
</div>

<script>
  // Default admin + users registered via Sign Up page
  const DEFAULT_USERS = [
    { username: 'admin',   password: 'admin123', firstName: 'Admin' },
    { username: 'student', password: 'pass123',  firstName: 'Student' }
  ];

  // If already logged in, skip login
  if (sessionStorage.getItem('rr_logged_in') === 'true') {
    window.location.href = '/index.html';
  }

  function handleLogin(e) {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    const errorMsg = document.getElementById('errorMsg');
    const btn      = document.getElementById('loginBtn');

    errorMsg.className = 'error-msg';

    // Check default users first
    let match = DEFAULT_USERS.find(u =>
      u.username.toLowerCase() === username.toLowerCase() && u.password === password
    );

    // Then check registered users from localStorage
    if (!match) {
      const registered = JSON.parse(localStorage.getItem('rr_users') || '[]');
      match = registered.find(u =>
        u.username.toLowerCase() === username.toLowerCase() && u.password === password
      );
    }

    if (match) {
      btn.textContent = '✅ Logging in...';
      btn.style.background = 'linear-gradient(135deg,#66bb6a,#388e3c)';
      sessionStorage.setItem('rr_logged_in', 'true');
      sessionStorage.setItem('rr_user', match.firstName || match.username);
      setTimeout(() => { window.location.href = '/index.html'; }, 800);
    } else {
      errorMsg.textContent = '❌ Invalid username or password. Please try again.';
      errorMsg.className = 'error-msg show';
      document.getElementById('password').value = '';
      document.getElementById('password').focus();
    }
  }
</script>
</body>
</html>
